version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fedbank-postgres
    environment:
      - POSTGRES_USER=fedbank
      - POSTGRES_PASSWORD=fedbank_secure_db_pass
      - POSTGRES_DB=fedbank_mlops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedbank -d fedbank_mlops"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: fedbank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: fedbank-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fedbank-backend
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///./fedbank.db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - SECRET_KEY=fedbank-production-jwt-secret-key-9823471092834
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - FLOWER_SERVER_ADDRESS=0.0.0.0:8080
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
    volumes:
      - ./dataset_storage:/app/dataset_storage
      - ./model_storage:/app/model_storage
      - ./report_storage:/app/report_storage
      - ./mlruns:/app/mlruns
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fedbank-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: fedbank-mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db --default-artifact-root /mlflow/mlruns --host 0.0.0.0 --port 5000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: fedbank-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.1
    container_name: fedbank-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
